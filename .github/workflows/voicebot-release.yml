name: Release voice dependency
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: pip install "$(find dist -name '*.whl')[voice]"
      - run: python -c "from discord.voice.receive.reader import AudioReader; from discord import Bot"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
